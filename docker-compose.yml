version: '3.8'

services:

  backend:
    build:
      context: ./modelo   # Vai usar o Dockerfile da pasta modelo
      dockerfile: Dockerfile
    volumes:
      - ./modelo/arquivos:/app/arquivos  # Montar a pasta de CSVs dentro do container
    ports:
      - "8000:8000"  # Expor o backend na porta 5000
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend  # Vai usar o Dockerfile da pasta frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Expor o frontend na porta 3000
    networks:
      - app_network
    depends_on:
      - backend  # Sobe o backend antes do frontend

networks:
  app_network:
